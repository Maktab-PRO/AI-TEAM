name: Materialize AI TEAM Control Plane source
on:
  workflow_dispatch:
  push:
    branches:
      - ai-team/control-plane-v0.1.0
    paths:
      - ai-team-control-plane-v0.1.0.zip
      - .github/workflows/materialize-control-plane.yml
permissions:
  contents: write
concurrency:
  group: materialize-control-plane-${{ github.ref }}
  cancel-in-progress: false
jobs:
  materialize-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify bundle and archive paths
        run: |
          set -euo pipefail
          echo "b01630bdf508d763f929b28eef7dce04d914f19e7c0093ed4ffecc43702eafa3  ai-team-control-plane-v0.1.0.zip" | sha256sum --check
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          archive = "ai-team-control-plane-v0.1.0.zip"
          with ZipFile(archive) as zf:
              names = zf.namelist()
              if not names:
                  raise SystemExit("Archive is empty")
              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  if not name.startswith("ai-team-control-plane/"):
                      raise SystemExit(f"Unexpected archive root: {name}")
          PY
          mkdir -p /tmp/control-plane-source
          unzip -q ai-team-control-plane-v0.1.0.zip -d /tmp/control-plane-source
      - name: Rebuild isolated feature branch from main
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          git fetch origin main
          git checkout --detach origin/main
          cp -a /tmp/control-plane-source/ai-team-control-plane/. .
          # GitHub App token lacks the workflow permission needed to push workflow files.
          # CI is run in this workflow until a separately authorized CI workflow is added.
          rm -f .github/workflows/ci.yml
          python -m pip install -e ".[test]"
          python -m compileall -q ai_team_control_plane tests
          python -m pytest -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add AI TEAM Control Plane v0.1.0"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${SOURCE_COMMIT}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
