name: AI TEAM Control Plane CI

on:
  push:
    branches:
      - main
      - ai-team/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile source and tests
        run: python -m compileall -q ai_team_control_plane tests
      - name: Run test suite
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security scanners
        run: python -m pip install --upgrade bandit pip-audit
      - name: Static security analysis
        run: bandit -r ai_team_control_plane -ll
      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_team_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_team_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_TEAM_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_team_test
      AI_TEAM_RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_team_restore_test
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run PostgreSQL transaction and concurrency tests
        run: python -m pytest -q tests/test_postgres_store.py
      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create logical backup
        run: pg_dump --dbname="$AI_TEAM_TEST_DATABASE_URL" --format=custom --no-owner --no-acl --file=/tmp/ai-team-control-plane.dump
      - name: Create isolated restore database
        run: createdb --host=127.0.0.1 --port=5432 --username=postgres --maintenance-db=postgres ai_team_restore_test
      - name: Restore logical backup
        run: pg_restore --dbname="$AI_TEAM_RESTORE_DATABASE_URL" --no-owner --no-acl --single-transaction --exit-on-error /tmp/ai-team-control-plane.dump
      - name: Verify restored rows and audit chain
        run: python -m pytest -q tests/test_postgres_restore.py
