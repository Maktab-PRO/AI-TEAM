name: Apply one-time security audit corrections

on:
  push:
    branches:
      - ai-team/control-plane-v0.1.0
    paths:
      - .github/workflows/apply-audit-fixes.yml
      - bootstrap/apply_audit_fixes.py

permissions:
  contents: write

concurrency:
  group: one-time-audit-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed corrections
        run: python bootstrap/apply_audit_fixes.py
      - name: Install and verify
        run: |
          python -m pip install -e ".[test]"
          python -m compileall -q ai_team_control_plane tests
          python -m pytest -q
      - name: Commit source-only changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ai_team_control_plane/api.py ai_team_control_plane/store.py ai_team_control_plane/registry.py ai_team_control_plane/orchestrator.py .env.example README.md docs/CONTROL-PLANE-SPEC.md docs/ARCHITECTURE.md tests/test_api.py tests/test_orchestrator.py tests/test_registry.py
          git diff --cached --check
          git commit -m "fix: harden audit, lease, and project boundaries"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
