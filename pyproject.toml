[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team-control-plane"
version = "0.1.0"
description = "Fail-closed multi-project AI TEAM control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0"
]

[project.optional-dependencies]
redis = ["redis>=5,<7"]
test = ["pytest>=9.0.3,<10", "httpx>=0.27,<1.0"]

[project.scripts]
ai-team = "ai_team_control_plane.cli:main"

[tool.setuptools.packages.find]
include = ["ai_team_control_plane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
